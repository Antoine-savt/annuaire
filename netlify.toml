# Netlify: static site, every page prerendered into dist/ by `npm run build` (see README).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Built files have a content hash in their name: they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The site lives on ledition-mariage.fr: the former Netlify address redirects page by page,
# so search engines move what they already know about each page to the new domain.
[[redirects]]
  from = "https://ledition-mariage-var.netlify.app/*"
  to = "https://ledition-mariage.fr/:splat"
  status = 301
  force = true
